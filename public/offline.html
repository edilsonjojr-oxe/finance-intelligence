<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Sem conexão · Finance Intelligence</title>
<style>
  :root { --bg: #111111; --ink: #f2efe8; --muted: #a9a39a; --gold: #ffd700; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
  main { max-width: 340px; }
  h1 { margin: 16px 0 6px; font-size: 22px; color: #faf8f3; }
  p { margin: 0 0 20px; color: var(--muted); }
  button { border: 0; border-radius: 8px; padding: 11px 18px; background: var(--gold); color: #1a1a1a; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192-v2.png" width="72" height="72" alt="">
  <h1>Sem conexão</h1>
  <p>O Finance Intelligence precisa de internet para mostrar seus dados. Nada é guardado neste aparelho.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
